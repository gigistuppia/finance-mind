#
# Este workflow venía FALLANDO desde antes de la migración: las tres últimas
# corridas dieron error, incluida la del commit "UI: reemplazar emojis por SVG",
# anterior a todo el trabajo de Vercel. O sea que no desplegaba nada y además
# marcaba en rojo cada push.
#
# Ya no corre en push. Queda como disparo manual desde la pestaña Actions, así
