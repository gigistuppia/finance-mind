# ══════════════════════════════════════════════════════════════════

name: Deploy to Cloudflare Workers (retirado — manual)

on:
  workflow_dispatch:
  # Retirado el 30/08/2026. Para reactivar, descomentar:
  # push:
  #   branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
