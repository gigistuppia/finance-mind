# ══════════════════════════════════════════════════════════════════
# NETLIFY RETIRADO — 30/08/2026. El host es Vercel (CLAUDE.md §1).
#
# `ignore` con salida 0 cancela el build: "An exit code of 0 indicates
# that there are no changes and the build should stop" (docs de Netlify).
# Con esto Netlify deja de redesplegarse en cada push a main.
#
# POR QUÉ: las vistas nuevas llaman a /api/map y /api/informe, que acá no
# existen — no hay funciones de Netlify para ellas ni redirects. El sitio
# cargaba pero esas pantallas devolvían 404. Antes que mantener dos copias
# sincronizadas de cada endpoint, se retira el host.
#
# NADA SE BORRA: netlify/functions/ sigue en el repo y esta config también.
# Para reactivar: sacar la línea `ignore` de abajo.
# (Ojo: esto no cancela builds disparados por build hooks; ésos se apagan
#  desde el panel de Netlify, en Build & deploy.)
# ══════════════════════════════════════════════════════════════════

[build]
  functions = "netlify/functions"
  ignore = "exit 0"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200

[[redirects]]
  from = "/api/quote"
  to = "/.netlify/functions/quote"
  status = 200

[[redirects]]
  from = "/api/validate-code"
  to = "/.netlify/functions/validate-code"
  status = 200

[[redirects]]
  from = "/api/mp-webhook"
  to = "/.netlify/functions/mp-webhook"
  status = 200

[[redirects]]
  from = "/api/events"
  to = "/.netlify/functions/events"
  status = 200

[[redirects]]
  from = "/app-v2/*"
  to = "/app-v2/:splat"
  status = 200

[[redirects]]
  from = "/"
  to = "/landing/index.html"
  status = 200
